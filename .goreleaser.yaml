# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  -
    env:
      - CGO_ENABLED=0

    targets:
      - linux_amd64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64

    hooks:
      post:
        - rm -f dist/config.yaml

archives:
  - formats: binary

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"

report_sizes: true

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
